[project]
name = "horizon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Louys Gackstetter", email = "louys.gackstetter@gmail.com" },
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
horizon = "horizon:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.4", "ty>=0.0.99"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
